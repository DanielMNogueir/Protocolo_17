<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@800;900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

<style>
  /* Container HUD com efeito Glassmorphism e Glow no contorno */
  .hud-logo-container {
    background: rgba(10, 14, 12, 0.75);
    backdrop-filter: blur(8px);
    padding: 24px 36px;
    display: inline-flex;
    flex-direction: column;
    align-items: flex-start;
    border-radius: 8px;
    border: 1px solid rgba(111, 224, 214, 0.2);
    box-shadow: 0 0 25px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(111, 224, 214, 0.05);
    position: relative;
    overflow: hidden;
  }

  /* Estilização do Texto Principal */
  .hud-title {
    font-family: 'Kanit', sans-serif;
    font-weight: 900;
    font-size: 46px;
    color: #f4faf8;
    letter-spacing: 2px;
    text-shadow: 0 0 10px rgba(244, 250, 248, 0.3);
  }

  /* Destaque do '17' com Neon Teal */
  .hud-number {
    font-family: 'Kanit', sans-serif;
    font-weight: 900;
    font-size: 46px;
    color: #6fe0d6;
    letter-spacing: 2px;
    margin-left: 8px;
    text-shadow: 0 0 12px rgba(111, 224, 214, 0.6), 0 0 24px rgba(111, 224, 214, 0.3);
  }

  /* Ícone Animado */
  .hud-icon {
    font-size: 18px;
    color: #7fd858;
    margin-left: 6px;
    margin-top: 4px;
    filter: drop-shadow(0 0 8px rgba(127, 216, 88, 0.8));
    animation: leafPulse 3s infinite ease-in-out;
  }

  /* Barra de Carga / Gradiente Tecnológico */
  .hud-bar {
    width: 100%;
    height: 4px;
    margin-top: 8px;
    background: linear-gradient(90deg, #3fb6e8 0%, #6fd85e 100%);
    border-radius: 2px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 10px rgba(63, 182, 232, 0.5);
  }

  /* Animação de Varredura/Scanline na Barra */
  .hud-bar::after {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 60%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.9), transparent);
    animation: hudScan 2.5s infinite linear;
  }

  /* Keyframes das Animações */
  @keyframes hudScan {
    0% { left: -60%; }
    100% { left: 140%; }
  }

  @keyframes leafPulse {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(127, 216, 88, 0.8)); }
    50% { transform: scale(1.15); filter: drop-shadow(0 0 14px rgba(127, 216, 88, 1)); }
  }
</style>

<div class="hud-logo-container">
  <div style="display:flex; align-items:center;">
    <span class="hud-title">PROTOCOLO</span>
    <span class="hud-number">17</span>
    <i class="ti ti-leaf hud-icon" aria-hidden="true"></i>
  </div>
  <div class="hud-bar"></div>
</div>
